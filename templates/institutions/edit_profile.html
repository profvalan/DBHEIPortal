{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Edit Profile - {{ institution.name }}{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-xl-9">
      <div class="d-flex align-items-center mb-4">
        <a href="{% url 'news:dashboard' %}" class="btn btn-outline-secondary btn-sm me-3"><i class="bi bi-arrow-left"></i></a>
        <h4 class="fw-bold mb-0"><i class="bi bi-building me-2 text-primary"></i>Edit Institution Profile</h4>
      </div>

      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          {% if institution.logo %}
          <div class="mb-3 text-center">
            <img src="{{ institution.logo.url }}" class="img-thumbnail" style="max-height:80px">
            <p class="text-muted small mt-1">Current logo</p>
          </div>
          {% endif %}
          <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {% crispy form %}
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
